# This repository is a single pnpm package. Keep the workspace explicit so
# pnpm 11 does not reject the file while reading build-script approvals.
packages: []

# pnpm 11 approved dependency build scripts (ERR_PNPM_IGNORED_BUILDS fix)
allowBuilds:
  esbuild: true
  onnxruntime-node: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

overrides:
  postcss: '>=8.5.18'
  sharp: '>=0.35.4'
